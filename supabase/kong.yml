{
  "_format_version": "1.1",
  "services": [
    {
      "name": "auth-v1",
      "url": "http://auth:9999",
      "routes": [
        {
          "name": "auth-v1-all",
          "paths": ["/auth/v1/"]
        }
      ]
    },
    {
      "name": "rest-v1",
      "url": "http://rest:3000",
      "routes": [
        {
          "name": "rest-v1-all",
          "paths": ["/rest/v1/"]
        }
      ]
    },
    {
      "name": "realtime-v1",
      "url": "http://realtime:4000/socket",
      "routes": [
        {
          "name": "realtime-v1-ws",
          "paths": ["/realtime/v1/"]
        }
      ]
    },
    {
      "name": "storage-v1",
      "url": "http://storage:5000",
      "routes": [
        {
          "name": "storage-v1-all",
          "paths": ["/storage/v1/"]
        }
      ]
    }
  ],
  "plugins": [
    {
      "name": "cors",
      "config": {
        "origins": ["*"],
        "methods": ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
        "headers": ["Authorization", "Content-Type", "apikey", "x-client-info"],
        "exposed_headers": ["Content-Range", "X-Total-Count"],
        "max_age": 3600,
        "credentials": true
      }
    }
  ]
}
